    <script>
      function hideImage() {
        console.log("hide");
        document.getElementById("flage").style.display = "none";
      }
      const quizQuestions = [
        {
          question_no: "1 / 20",
          question: "What is the primary goal of artificial intelligence (AI)?",
          options: [
            "To make machines more human-like",
            "To make machines intelligent and capable of performing tasks that require human intelligence",
            "To replace humans in the workforce",
            "To create robots with emotions",
          ],
          correctAnswer:
            "To make machines intelligent and capable of performing tasks that require human intelligence",
        },
        {
          question_no: "2 / 20",
          question:
            "Which of the following is NOT a subfield of artificial intelligence?",
          options: [
            "Machine Learning",
            "Robotics",
            "Cyber Security",
            "Natural Language Processing",
          ],
          correctAnswer: "Cyber Security",
        },
        {
          question_no: "3 / 20",
          question:
            "What is the main objective of supervised learning in machine learning?",
          options: [
            "To learn patterns from unlabeled data",
            "To predict outputs based on input data and labeled examples",
            "To learn from rewards and punishments",
            "To mimic human behavior",
          ],
          correctAnswer:
            "To predict outputs based on input data and labeled examples",
        },
        {
          question_no: "4 / 20",
          question:
            "Which AI technique involves the use of algorithms inspired by the structure and function of the brain's neural networks?",
          options: [
            "Machine Learning",
            "Natural Language Processing",
            "Deep Learning",
            "Reinforcement Learning",
          ],
          correctAnswer: "Deep Learning",
        },
        {
          question_no: "5 / 20",
          question: "What is the Turing Test in the context of AI?",
          options: [
            "A test to determine if a machine exhibits intelligent behavior indistinguishable from that of a human",
            "A test to measure the processing power of AI systems",
            "A test to evaluate the accuracy of machine learning models",
            "A test to check the speed of neural networks",
          ],
          correctAnswer:
            "A test to determine if a machine exhibits intelligent behavior indistinguishable from that of a human",
        },
        {
          question_no: "6 / 20",
          question:
            "Which programming language is commonly used for implementing AI algorithms?",
          options: ["Java", "C++", "Python", "Ruby"],
          correctAnswer: "Python",
        },
        {
          question_no: "7 / 20",
          question:
            "What is the process of allowing a machine to learn by itself without explicit programming?",
          options: [
            "Supervised Learning",
            "Unsupervised Learning",
            "Reinforcement Learning",
            "Deep Learning",
          ],
          correctAnswer: "Unsupervised Learning",
        },
        {
          question_no: "8 / 20",
          question:
            "Which of the following is a limitation of current AI systems?",
          options: [
            "Lack of computational power",
            "Limited data availability",
            "Inability to handle uncertainty",
            "All of the above",
          ],
          correctAnswer: "All of the above",
        },
        {
          question_no: "9 / 20",
          question:
            "Which AI technique is commonly used for decision-making in complex environments with uncertain outcomes?",
          options: [
            "Reinforcement Learning",
            "Supervised Learning",
            "Unsupervised Learning",
            "Deep Learning",
          ],
          correctAnswer: "Reinforcement Learning",
        },
        {
          question_no: "10 / 20",
          question:
            "Which AI application allows computers to understand, interpret, and generate human language?",
          options: [
            "Machine Vision",
            "Natural Language Processing",
            "Autonomous Vehicles",
            "Robotics",
          ],
          correctAnswer: "Natural Language Processing",
        },
        {
          question_no: "11 / 20",
          question:
            "What is the term used to describe the process of teaching a machine to perform a task by showing it examples rather than programming it with specific rules?",
          options: [
            "Supervised Learning",
            "Unsupervised Learning",
            "Reinforcement Learning",
            "Deep Learning",
          ],
          correctAnswer: "Supervised Learning",
        },
        {
          question_no: "12 / 20",
          question:
            "Which AI technique involves learning from trial and error to achieve a goal?",
          options: [
            "Supervised Learning",
            "Unsupervised Learning",
            "Reinforcement Learning",
            "Deep Learning",
          ],
          correctAnswer: "Reinforcement Learning",
        },
        {
          question_no: "13 / 20",
          question:
            "What is the term used for the ability of AI systems to generalize knowledge from specific examples to new, unseen situations?",
          options: [
            "Transfer Learning",
            "Pattern Recognition",
            "Feature Extraction",
            "Overfitting",
          ],
          correctAnswer: "Transfer Learning",
        },
        {
          question_no: "14 / 20",
          question: "Which of the following is an example of a narrow AI?",
          options: [
            "A system that can play chess at a grandmaster level",
            "A system that can understand and generate human-like conversation",
            "A system that can perform a wide range of tasks across different domains",
            "A system that can learn to recognize objects in images",
          ],
          correctAnswer: "A system that can play chess at a grandmaster level",
        },
        {
          question_no: "15 / 20",
          question:
            "Which of the following AI techniques is most suitable for detecting anomalies or outliers in data?",
          options: [
            "Supervised Learning",
            "Unsupervised Learning",
            "Reinforcement Learning",
            "Deep Learning",
          ],
          correctAnswer: "Unsupervised Learning",
        },
        {
          question_no: "16 / 20",
          question:
            "Which AI technique involves identifying patterns in data to make predictions about future events?",
          options: [
            "Machine Learning",
            "Natural Language Processing",
            "Deep Learning",
            "Reinforcement Learning",
          ],
          correctAnswer: "Machine Learning",
        },
        {
          question_no: "17 / 20",
          question:
            "What is the term used for the phenomenon where AI systems exhibit biased behavior based on the data they were trained on?",
          options: [
            "Overfitting",
            "Underfitting",
            "Bias-Variance Tradeoff",
            "Algorithmic Bias",
          ],
          correctAnswer: "Algorithmic Bias",
        },
        {
          question_no: "18 / 20",
          question:
            "Which of the following is NOT a potential application of AI in healthcare?",
          options: [
            "Diagnosing diseases from medical images",
            "Personalized treatment recommendations",
            "Autonomous surgery",
            "Predicting stock market trends",
          ],
          correctAnswer: "Predicting stock market trends",
        },
        {
          question_no: "19 / 20",
          question:
            "What is the term used for the ability of AI systems to continuously learn and improve from new data without human intervention?",
          options: [
            "Reinforcement Learning",
            "Deep Learning",
            "Unsupervised Learning",
            "Online Learning",
          ],
          correctAnswer: "Online Learning",
        },
        {
          question_no: "20 / 20",
          question:
            "Which AI technique involves dividing a problem into smaller subproblems and solving each one separately?",
          options: [
            "Divide and Conquer",
            "Ensemble Learning",
            "Clustering",
            "Gradient Descent",
          ],
          correctAnswer: "Divide and Conquer",
        },
      ];

      // Variables to track quiz state
      let currentQuestionIndex = 0;
      let score = 0;
      let timeLeft = 140;
      let timerInterval;

      // Function to start the quiz
      function startQuiz() {
        // Hide the start button and display the first question
        document.getElementById("start-button").style.display = "none";
        displayQuestion();
        startTimer();
      }

      // Function to display a question and its options
      function displayQuestion() {
        const currentQuestion = quizQuestions[currentQuestionIndex];
        const questionNo = document.getElementById("question-No");
        const questionText = document.getElementById("question-text");
        const answerButtons = document.getElementById("answer-buttons");

        // Clear previous question and answer options
        questionNo.innerHTML = "";
        questionText.innerHTML = "";
        answerButtons.innerHTML = "";

        // Display the current question
        questionNo.innerHTML = currentQuestion.question_no;
        questionText.innerHTML = currentQuestion.question;

        // Create answer buttons for each option
        currentQuestion.options.forEach((option) => {
          const button = document.createElement("button");
          button.innerText = option;
          button.classList.add("answer-button");
          button.style.backgroundColor = "#FF5F6D ";
          answerButtons.appendChild(button);

          // Add click event listener to check the answer
          button.addEventListener("click", function () {
            checkAnswer(option);
          });
        });
      }

      // Function to check the selected answer
      function checkAnswer(selectedOption) {
        const currentQuestion = quizQuestions[currentQuestionIndex];

        // Check if the selected answer is correct
        if (selectedOption === currentQuestion.correctAnswer) {
          score++;
        }

        // Move to the next question or end the quiz if all questions are answered
        currentQuestionIndex++;

        if (currentQuestionIndex < quizQuestions.length) {
          displayQuestion();
        } else {
          endQuiz();
        }
      }

      // Function to start the timer
      function startTimer() {
        timerInterval = setInterval(function () {
          timeLeft--;

          // Update the timer text
          document.getElementById("timer").textContent = timeLeft;

          // End the quiz if time runs out
          if (timeLeft <= 0) {
            endQuiz();
          }
        }, 1000);
      }

      // Function to end the quiz
      function endQuiz() {
        // Stop the timer
        clearInterval(timerInterval);

        // Calculate the score percentage
        const scorePercentage = (score / quizQuestions.length) * 100;

        // Display the final score
        const questionContainer = document.getElementById("question-container");
        questionContainer.innerHTML = `
<h2>Quiz Completed!</h2>
<p>Your Score: ${score} out of ${quizQuestions.length}</p>
<p>Score Percentage: ${scorePercentage}%</p>
<center class="result-button">
    <a href="/">
        <button id="home-button" style="background-color:#FF5F6D">Play Other quiz</button>
    </a>
    <a href="">
        <button id="home-button" style="background-color:#FF5F6D">Play Again</button>
    </a>
</center>
`;
      }

      // Add event listener to start the quiz when the start button is clicked
      document
        .getElementById("start-button")
        .addEventListener("click", startQuiz);
    </script>
