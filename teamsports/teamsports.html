    <script>
      function hideImage() {
        console.log("hide");
        document.getElementById("flage").style.display = "none";
      }
      const quizQuestions = [
        {
          question_no: "1 / 20",
          question:
            "In basketball, how many players are on the court for each team during a game?",
          options: ["5", "6", "7", "4"],
          correctAnswer: "5",
        },
        {
          question_no: "2 / 20",
          question: "What is the term for a score of zero in tennis?",
          options: ["Love", "Deuce", "Fault", "Ace"],
          correctAnswer: "Love",
        },
        {
          question_no: "3 / 20",
          question:
            "In volleyball, how many touches are allowed per side before the ball must be returned over the net?",
          options: ["2", "3", "4", "5"],
          correctAnswer: "3",
        },
        {
          question_no: "4 / 20",

          correctAnswer: "Perfect Game",
        },
        {
          question_no: "5 / 20",

        },
        {
          question_no: "6 / 20",
          question:
            "What is the term for a foul committed in soccer that results in a penalty kick for the opposing team?",
          options: ["Offside", "Yellow card", "Penalty", "Corner kick"],
          correctAnswer: "Penalty",
        },
        {
          question_no: "7 / 20",
          question:
            "In hockey, how many players are on the ice for each team during a game?",
          options: ["5", "6", "7", "4"],
          correctAnswer: "6",
        },
        {
          question_no: "8 / 20",
          question:
            "What is the term for a legal serve that the opponent fails to return in table tennis?",
          options: ["Smash", "Rally", "Ace", "Point"],
          correctAnswer: "Ace",
        },
        {
          question_no: "9 / 20",
          question:
            "In American football, how many points is a touchdown worth?",
          options: ["3", "6", "7", "2"],
          correctAnswer: "6",
        },
        {
          question_no: "10 / 20",
          question:
            "What is the term for a shot that scores three points in basketball?",
          options: ["Layup", "Dunk", "Free throw", "Three-pointer"],
          correctAnswer: "Three-pointer",
        },
        {
          question_no: "11 / 20",
          question:
            "In water polo, how many players are in the pool for each team during a game?",
          options: ["5", "6", "7", "8"],
          correctAnswer: "6",
        },
        {
          question_no: "12 / 20",
          question:
            "What is the term for a shot that scores one point in badminton?",
          options: ["Smash", "Serve", "Drop shot", "Let"],
          correctAnswer: "Serve",
        },
        {
          question_no: "13 / 20",
          question:
            "In lacrosse, how many players are on the field for each team during a game?",
          options: ["8", "9", "10", "11"],
          correctAnswer: "10",
        },
        {
          question_no: "14 / 20",
          question:
            "What is the term for a legal shot in billiards that results in the cue ball striking two or more balls simultaneously?",
          options: ["Scratch", "Combo", "Bank shot", "Carom"],
          correctAnswer: "Carom",
        },
        {
          question_no: "15 / 20",
          question:
            "In handball, how many players are on the court for each team during a game?",
          options: ["5", "6", "7", "8"],
          correctAnswer: "7",
        },
        {
          question_no: "16 / 20",
          question:
            "What is the term for a shot that scores two points in volleyball?",
          options: ["Spike", "Serve", "Block", "Kill"],
          correctAnswer: "Spike",
        },
        {
          question_no: "17 / 20",
          question:
            "In field hockey, how many players are on the field for each team during a game?",
          options: ["9", "10", "11", "12"],
          correctAnswer: "11",
        },
        {
          question_no: "18 / 20",
          question:
            "What is the term for a legal shot in golf that results in the ball going directly into the hole?",
          options: ["Birdie", "Par", "Eagle", "Hole-in-one"],
          correctAnswer: "Hole-in-one",
        },
        {
          question_no: "19 / 20",
          question:
            "In netball, how many players are on the court for each team during a game?",
          options: ["5", "6", "7", "8"],
          correctAnswer: "7",
        },
        {
          question_no: "20 / 20",
          question:
            "What is the term for a legal shot in squash that results in the opponent being unable to return the ball?",
          options: ["Let", "Fault", "Stroke", "Rally"],
          correctAnswer: "Stroke",
        },
      ];

      // Variables to track quiz state
      let currentQuestionIndex = 0;
      let score = 0;
      let timeLeft = 140;
      let timerInterval;

      // Function to start the quiz
      function startQuiz() {
        // Hide the start button and display the first question
        document.getElementById("start-button").style.display = "none";
        displayQuestion();
        startTimer();
      }

      // Function to display a question and its options
      function displayQuestion() {
        const currentQuestion = quizQuestions[currentQuestionIndex];
        const questionNo = document.getElementById("question-No");
        const questionText = document.getElementById("question-text");
        const answerButtons = document.getElementById("answer-buttons");

        // Clear previous question and answer options
        questionNo.innerHTML = "";
        questionText.innerHTML = "";
        answerButtons.innerHTML = "";

        // Display the current question
        questionNo.innerHTML = currentQuestion.question_no;
        questionText.innerHTML = currentQuestion.question;

        // Create answer buttons for each option
        currentQuestion.options.forEach((option) => {
          const button = document.createElement("button");
          button.innerText = option;
          button.classList.add("answer-button");
          button.style.backgroundColor = "#FF5F6D";
          answerButtons.appendChild(button);

          // Add click event listener to check the answer
          button.addEventListener("click", function () {
            checkAnswer(option);
          });
        });
      }

      // Function to check the selected answer
      function checkAnswer(selectedOption) {
        const currentQuestion = quizQuestions[currentQuestionIndex];

        // Check if the selected answer is correct
        if (selectedOption === currentQuestion.correctAnswer) {
          score++;
        }

        // Move to the next question or end the quiz if all questions are answered
        currentQuestionIndex++;

        if (currentQuestionIndex < quizQuestions.length) {
          displayQuestion();
        } else {
          endQuiz();
        }
      }

      // Function to start the timer
      function startTimer() {
        timerInterval = setInterval(function () {
          timeLeft--;

          // Update the timer text
          document.getElementById("timer").textContent = timeLeft;

          // End the quiz if time runs out
          if (timeLeft <= 0) {
            endQuiz();
          }
        }, 1000);
      }

      // Function to end the quiz
      function endQuiz() {
        // Stop the timer
        clearInterval(timerInterval);

        // Calculate the score percentage
        const scorePercentage = (score / quizQuestions.length) * 100;

        // Display the final score
        const questionContainer = document.getElementById("question-container");
        questionContainer.innerHTML = `
<h2>Quiz Completed!</h2>
<p>Your Score: ${score} out of ${quizQuestions.length}</p>
<p>Score Percentage: ${scorePercentage}%</p>
<center class="result-button">
    <a href="/">
        <button id="home-button" style="background-color:#FF5F6D">Play Other quiz</button>
    </a>
    <a href="">
        <button id="home-button" style="background-color:#FF5F6D">Play Again</button>
    </a>
</center>
`;
      }

      // Add event listener to start the quiz when the start button is clicked
      document
        .getElementById("start-button")
        .addEventListener("click", startQuiz);
    </script>
