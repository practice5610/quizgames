    <script>
      // Fetch articles from an external JSON file
      async function fetchArticles() {
        try {
          const response = await fetch("articles.json"); // Replace with the path to your JSON file
          const articles = await response.json();
          displayRandomArticle(articles);
        } catch (error) {
          console.error("Error fetching articles:", error);
        }
      }

      // Display a random article
      function displayRandomArticle(articles) {
        const randomIndex = Math.floor(Math.random() * articles.length);
        const article = articles[randomIndex];
        const articleSection = document.getElementById("article-section");

        // Construct the article content with paragraphs
        const paragraphs = article.content
          .map((paragraph) => `<p>${paragraph}</p>`)
          .join("");

        articleSection.innerHTML = `
        <h3>${article.title}</h3>
        ${paragraphs}
    `;
      }

      // Redirect function for buttons
      function redirectToIndex() {
        window.location.href = "rendomquiz.html";
      }

      // Fetch and display articles on page load
      fetchArticles();
    </script>

    <script>
      (function () {
        document.addEventListener("DOMContentLoaded", function () {
          console.log("DOM fully loaded.");

          function showRewardedAd() {
            if (!window.googletag || !googletag.cmd) {
              console.error("Google Ad Manager is not properly initialized.");
              return;
            }

            googletag.cmd.push(function () {
              try {
                const rewardedSlot = googletag
                  .defineOutOfPageSlot(
                    "/22792691312,23155424426/web_innoblazes.com_display_banner_3",
                    googletag.enums.OutOfPageFormat.REWARDED
                  )
                  .addService(googletag.pubads());

                googletag.enableServices();
                googletag.display(rewardedSlot);
                console.log("Attempting to display rewarded ad...");

                googletag
                  .pubads()
                  .addEventListener("rewardedSlotReady", function (evt) {
                    console.log("Rewarded ad ready.");
                    evt.makeRewardedVisible();
                  });

                googletag
                  .pubads()
                  .addEventListener("rewardedSlotClosed", function () {
                    console.log("Ad closed.");
                    googletag.destroySlots([rewardedSlot]);
                  });
              } catch (error) {
                console.error("Error during ad setup:", error);
              }
            });
          }

          // Add 2-second delay before showing the rewarded ad
          setTimeout(function () {
            console.log("2 seconds elapsed, showing rewarded ad...");
            showRewardedAd();
          }, 2000); // 2000 milliseconds = 2 seconds
        });
      })();
    </script>
