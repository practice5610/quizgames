      // Variables to track quiz state
      let currentQuestionIndex = 0;
      let score = 0;
      let timeLeft = 140;
      let timerInterval;

      // Function to start the quiz
      function startQuiz() {
        // Hide the start button and display the first question
        document.getElementById("start-button").style.display = "none";
        // Hide the winners-information card
        var winnersInfo = document.querySelector(".winners-information");
        if (winnersInfo) {
          winnersInfo.style.display = "none";
        }
        // Show the counter
        var counterRow = document.querySelector(".question-count-and-counter");
        if (counterRow) {
          counterRow.style.display = "flex";
        }
        displayQuestion();
        startTimer();
      }

      // Function to display a question and its options
      function displayQuestion() {
        const currentQuestion = quizQuestions[currentQuestionIndex];
        const questionNo = document.getElementById("question-No");
        const questionText = document.getElementById("question-text");
        const answerButtons = document.getElementById("answer-buttons");

        // Clear previous question and answer options
        questionNo.innerHTML = "";
        questionText.innerHTML = "";
        answerButtons.innerHTML = "";

        questionText.innerHTML = currentQuestion.question;

        // Update the counter above the timer
        var currentQuesCount = document.querySelector(".currentQuesCount");
        if (currentQuesCount) {
          currentQuesCount.textContent = currentQuestionIndex + 1;
        }
        // If you want to ensure the total is always 20, you can also update the /20 part if needed
        // var totalQuesCount = document.querySelector('.totalQuesCount');
        // if (totalQuesCount) {
        //   totalQuesCount.textContent = quizQuestions.length;
        // }

        // Create answer buttons for each option
        currentQuestion.options.forEach((option) => {
          const button = document.createElement("button");
          button.classList.add("answer-button");
          button.style.display = "flex";
          button.style.alignItems = "center";
          button.style.justifyContent = "space-between";
          button.style.textAlign = "left";

          // Add text and emoji spans
          const textSpan = document.createElement("span");
          textSpan.className = "btn-text";
          textSpan.textContent = option;
          const emojiSpan = document.createElement("span");
          emojiSpan.className = "btn-emoji";
          button.appendChild(textSpan);
          button.appendChild(emojiSpan);

          answerButtons.appendChild(button);

          // Add click event listener to check the answer
          button.addEventListener("click", function () {
            // Disable all buttons
            const allButtons = document.querySelectorAll(".answer-button");
            allButtons.forEach((b) => (b.disabled = true));

            // Check if the selected answer is correct
            if (option === currentQuestion.correctAnswer) {
              button.style.backgroundColor = "#28a745";
              button.style.border = "none";
              emojiSpan.textContent = "😊";
              score++;
            } else {
              button.style.backgroundColor = "#dc3545";
              button.style.border = "none";
              emojiSpan.textContent = "😢";
            }

            // Move to the next question or end the quiz after a short delay
            setTimeout(() => {
              currentQuestionIndex++;
              if (currentQuestionIndex < quizQuestions.length) {
                displayQuestion();
              } else {
                endQuiz();
              }
            }, 700);
          });
        });
      }

      // Function to start the timer
      function startTimer() {
        timerInterval = setInterval(function () {
          timeLeft--;

          // Update the timer text in the correct element
          var timerDisplay = document.querySelector(".display-remain-time");
          if (timerDisplay) {
            timerDisplay.textContent = timeLeft;
          }

          // End the quiz if time runs out
          if (timeLeft <= 0) {
            endQuiz();
          }
        }, 1000);
      }

        // Stop the timer
        clearInterval(timerInterval);

        // Calculate the score percentage
        const scorePercentage = (score / quizQuestions.length) * 100;
