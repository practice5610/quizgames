    <script>
      function hideImage() {
        console.log("hide");
        document.getElementById("flage").style.display = "none";
      }
      const quizQuestions = [
        {
          question_no: "1 / 20",
          question:
            'What does the acronym "VPN" stand for in the context of Cyber Security?',
          options: [
            "Virtual Private Network",
            "Very Private Network",
            "Visual Processing Node",
            "Virtual Protocol Network",
          ],
          correctAnswer: "Virtual Private Network",
        },
        {
          question_no: "2 / 20",
          question:
            "Which of the following is a type of malware that encrypts files and demands payment for their release?",
          options: ["Spyware", "Ransomware", "Adware", "Worm"],
          correctAnswer: "Ransomware",
        },
        {
          question_no: "3 / 20",
          question:
            "What is the term used for the practice of tricking individuals into providing sensitive information such as passwords or credit card numbers?",
          options: ["Phishing", "Spoofing", "DDoS Attack", "SQL Injection"],
          correctAnswer: "Phishing",
        },
        {
          question_no: "4 / 20",
          question:
            "Which of the following is NOT a common authentication factor in multi-factor authentication (MFA)?",
          options: [
            "Something you know",
            "Something you have",
            "Something you are",
            "Something you want",
          ],
          correctAnswer: "Something you want",
        },
        {
          question_no: "5 / 20",
          question: "What is the purpose of a firewall in Cyber Security?",
          options: [
            "To encrypt data transmissions",
            "To filter network traffic and prevent unauthorized access",
            "To detect and remove malware",
            "To monitor user activity",
          ],
          correctAnswer:
            "To filter network traffic and prevent unauthorized access",
        },
        {
          question_no: "6 / 20",
          question:
            "Which encryption algorithm is widely used for securing internet communications?",
          options: ["RSA", "AES", "DES", "SHA"],
          correctAnswer: "AES",
        },
        {
          question_no: "7 / 20",
          question:
            "What is the term used for a security vulnerability that allows attackers to execute arbitrary code on a target system?",
          options: [
            "Buffer Overflow",
            "Cross-Site Scripting (XSS)",
            "SQL Injection",
            "Man-in-the-Middle (MitM) Attack",
          ],
          correctAnswer: "Buffer Overflow",
        },
        {
          question_no: "8 / 20",
          question:
            "Which of the following is a best practice for creating strong passwords?",
          options: [
            "Using common words or phrases",
            "Including personal information such as your name or birthdate",
            "Using a combination of uppercase and lowercase letters, numbers, and special characters",
            "Sharing passwords with trusted friends or colleagues",
          ],
          correctAnswer:
            "Using a combination of uppercase and lowercase letters, numbers, and special characters",
        },
        {
          question_no: "9 / 20",
          question: "What is the purpose of encryption in Cyber Security?",
          options: [
            "To hide the presence of malware on a system",
            "To prevent unauthorized access to sensitive data",
            "To detect and remove viruses from files",
            "To block phishing attacks",
          ],
          correctAnswer: "To prevent unauthorized access to sensitive data",
        },
        {
          question_no: "10 / 20",
          question:
            "Which of the following is an example of a physical security control?",
          options: [
            "Firewall",
            "Antivirus Software",
            "Biometric Access Control",
            " Intrusion Detection System (IDS)",
          ],
          correctAnswer: "Biometric Access Control",
        },
        {
          question_no: "11 / 20",
          question:
            "What is the term used for the process of identifying and prioritizing vulnerabilities in a system or network?",
          options: [
            "Penetration Testing",
            "Vulnerability Assessment",
            "Threat Modeling",
            "Risk Management",
          ],
          correctAnswer: "Vulnerability Assessment",
        },
        {
          question_no: "12 / 20",
          question:
            "Which type of attack involves flooding a network or server with excessive traffic to disrupt normal operation?",
          options: [
            "Phishing Attack",
            "DDoS Attack",
            "Man-in-the-Middle Attack",
            "SQL Injection Attack",
          ],
          correctAnswer: "DDoS Attack",
        },
        {
          question_no: "13 / 20",
          question:
            "What is the term used for the practice of gaining unauthorized access to wireless networks?",
          options: ["Spoofing", "Wardriving", "Pharming", "Bluesnarfing"],
          correctAnswer: "Wardriving",
        },
        {
          question_no: "14 / 20",
          question:
            "Which security measure is used to verify the integrity and authenticity of transmitted data?",
          options: [
            "Digital Signature",
            "VPN",
            "Firewall",
            "Antivirus Software",
          ],
          correctAnswer: "Digital Signature",
        },
        {
          question_no: "15 / 20",
          question:
            "What is the term used for a program that appears legitimate but performs malicious actions when executed?",
          options: ["Worm", "Trojan Horse", "Rootkit", "Logic Bomb"],
          correctAnswer: "Trojan Horse",
        },
        {
          question_no: "16 / 20",
          question:
            "Which of the following is a common method used by hackers to gain unauthorized access to a system?",
          options: [
            "SQL Injection",
            "Phishing",
            "Brute Force Attack",
            "All of the above",
          ],
          correctAnswer: "All of the above",
        },
        {
          question_no: "17 / 20",
          question:
            "Which security protocol is used to establish secure connections over the internet?",
          options: ["HTTP", "FTP", "SSL/TLS", "DNS"],
          correctAnswer: "SSL/TLS",
        },
        {
          question_no: "18 / 20",
          question:
            "What is the primary purpose of an intrusion detection system (IDS)?",
          options: [
            "To prevent unauthorized access to a network",
            "To monitor network traffic and detect suspicious activity",
            "To encrypt sensitive data transmissions",
            "To scan for viruses and malware on a system",
          ],
          correctAnswer:
            "To monitor network traffic and detect suspicious activity",
        },
        {
          question_no: "19 / 20",
          question:
            "Which of the following is NOT a common type of social engineering attack?",
          options: ["Phishing", "Tailgating", "Smurf Attack", "CEO Fraud"],
          correctAnswer: "Smurf Attack",
        },
        {
          question_no: "20 / 20",
          question:
            "What is the term used for the process of restoring data from backups after a security breach or data loss incident?",
          options: [
            "Data Recovery",
            "Incident Response",
            "Disaster Recovery",
            "Business Continuity",
          ],
          correctAnswer: "Data Recovery",
        },
      ];

      // Variables to track quiz state
      let currentQuestionIndex = 0;
      let score = 0;
      let timeLeft = 140;
      let timerInterval;

      // Function to start the quiz
      function startQuiz() {
        // Hide the start button and display the first question
        document.getElementById("start-button").style.display = "none";
        displayQuestion();
        startTimer();
      }

      // Function to display a question and its options
      function displayQuestion() {
        const currentQuestion = quizQuestions[currentQuestionIndex];
        const questionNo = document.getElementById("question-No");
        const questionText = document.getElementById("question-text");
        const answerButtons = document.getElementById("answer-buttons");

        // Clear previous question and answer options
        questionNo.innerHTML = "";
        questionText.innerHTML = "";
        answerButtons.innerHTML = "";

        // Display the current question
        questionNo.innerHTML = currentQuestion.question_no;
        questionText.innerHTML = currentQuestion.question;

        // Create answer buttons for each option
        currentQuestion.options.forEach((option) => {
          const button = document.createElement("button");
          button.innerText = option;
          button.classList.add("answer-button");
          button.style.backgroundColor = "#FF5F6D";
          answerButtons.appendChild(button);

          // Add click event listener to check the answer
          button.addEventListener("click", function () {
            checkAnswer(option);
          });
        });
      }

      // Function to check the selected answer
      function checkAnswer(selectedOption) {
        const currentQuestion = quizQuestions[currentQuestionIndex];

        // Check if the selected answer is correct
        if (selectedOption === currentQuestion.correctAnswer) {
          score++;
        }

        // Move to the next question or end the quiz if all questions are answered
        currentQuestionIndex++;

        if (currentQuestionIndex < quizQuestions.length) {
          displayQuestion();
        } else {
          endQuiz();
        }
      }

      // Function to start the timer
      function startTimer() {
        timerInterval = setInterval(function () {
          timeLeft--;

          // Update the timer text
          document.getElementById("timer").textContent = timeLeft;

          // End the quiz if time runs out
          if (timeLeft <= 0) {
            endQuiz();
          }
        }, 1000);
      }

      // Function to end the quiz
      function endQuiz() {
        // Stop the timer
        clearInterval(timerInterval);

        // Calculate the score percentage
        const scorePercentage = (score / quizQuestions.length) * 100;

        // Display the final score
        const questionContainer = document.getElementById("question-container");
        questionContainer.innerHTML = `
<h2>Quiz Completed!</h2>
<p>Your Score: ${score} out of ${quizQuestions.length}</p>
<p>Score Percentage: ${scorePercentage}%</p>
<center class="result-button">
    <a href="/">
        <button id="home-button" style="background-color:#FF5F6D">Play Other quiz</button>
    </a>
    <a href="">
        <button id="home-button" style="background-color:#FF5F6D"Play Again</button>
    </a>
</center>
`;
      }

      // Add event listener to start the quiz when the start button is clicked
      document
        .getElementById("start-button")
        .addEventListener("click", startQuiz);
    </script>
