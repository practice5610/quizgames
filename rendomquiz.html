    <script>
        let quizzes = [];
        let selectedQuizzes = [];
        let currentQuiz = 0;
        let coins = 0;
        let timerInterval;

let timePassed = 0; // Tracks how much time has passed
const TIME_LIMIT = 30; // Total time in seconds
        const questionElement = document.getElementById('question');
        const optionsElement = document.getElementById('options');
        const coinsElement = document.getElementById('coins');
        const coinPopupElement = document.getElementById('coin-popup');
        const descriptionElement = document.getElementById('description');
        const timerElement = document.getElementById('timer');
        const popup = document.getElementById('reward-popup');
        const claimButton = document.getElementById('claim-button');
        const closeButton = document.getElementById('close-button');
        const currentQuestionElement = document.getElementById('current-question');
        const totalQuestionsElement = document.getElementById('total-questions');

        totalQuestionsElement.textContent = 5;

        async function loadQuestions() {
            try {
               const response = await fetch('./questions.json');
                quizzes = await response.json();
                console.log("quizzes",quizzes);

                selectedQuizzes = quizzes.sort(() => 0.5 - Math.random()).slice(0, 5);
                loadQuiz();
            } catch (error) {
                console.error('Error fetching questions:', error);
            }
        }

   function startTimer() {
    const timerElement = document.getElementById("timer"); // Keep your timer element
    const baseTimerPath = document.getElementById("base-timer-path-remaining"); // Circle path
    let timeLeft = 30; // Total time
    const FULL_DASH_ARRAY = 283; // Full stroke-dasharray for the circle

    timerElement.textContent = timeLeft;

    timerInterval = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;

        // Update the stroke-dasharray for the visual timer
        baseTimerPath.setAttribute(
            "stroke-dasharray",
            `${calculateTimeFraction(timeLeft) * FULL_DASH_ARRAY} ${FULL_DASH_ARRAY}`
        );

        if (timeLeft === 0) {
            clearInterval(timerInterval);
            alert("Time's up! Moving to the next question.");
            currentQuiz++;
            loadQuiz();
        }
    }, 1000);
}

// Calculate the fraction of time left
function calculateTimeFraction(timeLeft) {
    const TIME_LIMIT = 30; // Total time limit
    return timeLeft / TIME_LIMIT;
}


        function loadQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            if (currentQuiz < selectedQuizzes.length) {
                const quiz = selectedQuizzes[currentQuiz];
                console.log("quiz",quiz);

                questionElement.textContent = quiz.question;
                optionsElement.innerHTML = "";
                descriptionElement.innerHTML = quiz.description;
                currentQuestionElement.textContent = currentQuiz + 1;

               for (let i = 0; i < 4; i++) {  // Loop from 0 to 3 (array index)
    const button = document.createElement('button');
    button.textContent = quiz.options[i]; // Correctly access options array
    button.onclick = () => checkAnswer(quiz.options[i] === quiz.answer, button, quiz.options.indexOf(quiz.answer));
    optionsElement.appendChild(button);
}

                startTimer();
            } else {
                showFinalScore();
            }
        }

        function checkAnswer(isCorrect, button, correctIndex) {
            if (timerInterval) clearInterval(timerInterval);
            if (isCorrect) {
                button.classList.add('correct');
            } else {
                button.classList.add('wrong');
                document.querySelectorAll('.options button')[correctIndex].classList.add('correct');
            }

            let coinChange = isCorrect ? 100 : -50;
            coins += coinChange;
            coinsElement.textContent = coins;

            coinPopupElement.textContent = `${coinChange > 0 ? " +" : "💵"}${coinChange}`;
            coinPopupElement.style.color = coinChange > 0 ? "limegreen" : "red";
            coinPopupElement.style.display = "block";
            coinPopupElement.style.animation = "fadeMove 1.5s forwards";

            setTimeout(() => {
                coinPopupElement.style.display = "none";
                if (currentQuiz === 0 || (currentQuiz + 1) % 3 === 0) {
                    showPopup();
                } else {
                    currentQuiz++;
                    loadQuiz();
                }
            }, 1500);
        }

        function showPopup() {
            popup.style.display = "block";
        }

        function hidePopup() {
            popup.style.display = "none";
        }

        claimButton.onclick = () => {

            coins += 500;
            coinsElement.textContent = coins;
            hidePopup();
            alert("Ad watched! 500 coins added!");
            currentQuiz++;
            loadQuiz();

        };

        closeButton.onclick = () => {
            alert("You must watch the ad to proceed.");
        };


      function showFinalScore() {
    // Save the final score to localStorage
    localStorage.setItem('finalScore', coins);

    document.getElementById('quiz-container').innerHTML = `
        <div class="final-score">
            <h2>Quiz Completed!</h2>
            <p>Your Final Score:  ${coins}</p>
            <button class="play-now" onclick="redirectToNextQuiz()">Play Now</button>
        </div>
    `;
}

// Redirect function for the Play Now button
function redirectToNextQuiz() {
    window.location.href = "quiz-category.html"; // Replace "next_quiz.html" with the URL of your next page
}

                  .pubads()
                  .addEventListener("rewardedSlotClosed", function () {
                    console.log("Ad closed.");
                    googletag.destroySlots([rewardedSlot]);
                  });
              } catch (error) {
                console.error("Error during ad setup:", error);
              }
            });
          }

          // Add 2-second delay before showing the rewarded ad
          setTimeout(function () {
            console.log("2 seconds elapsed, showing rewarded ad...");
            showRewardedAd();
          }, 2000); // 2000 milliseconds = 2 seconds
        });
      })();
    </script>


</body>
</html>
