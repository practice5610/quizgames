    <script>
      function hideImage() {
        console.log("hide");
        document.getElementById("flage").style.display = "none";
      }
      const quizQuestions = [
        {
          question_no: "1 / 20",
          question:
            'What does the abbreviation "OS" stand for in the context of mobile devices?',
          options: [
            "Online Service",
            "Operating System",
            "Optical Sensor",
            "Operating Software",
          ],
          correctAnswer: "Operating System",
        },
        {
          question_no: "2 / 20",
          question: "Which mobile operating system is developed by Apple Inc.?",
          options: ["Android", "iOS", "Windows Mobile", "BlackBerry OS"],
          correctAnswer: "iOS",
        },
        {
          question_no: "3 / 20",
          question:
            "What is the term used for small programs that enhance the functionality of mobile apps?",
          options: ["Widgets", "Plugins", "Extensions", "Add-ons"],
          correctAnswer: "Plugins",
        },
        {
          question_no: "4 / 20",
          question:
            "Which wireless communication technology is commonly used for transferring data between mobile devices over short distances?",
          options: ["LTE", "NFC", "5G", "WiMAX"],
          correctAnswer: "NFC",
        },
        {
          question_no: "5 / 20",
          question: "What is the purpose of a SIM card in a mobile device?",
          options: [
            "To store contact information",
            "To provide additional storage space",
            "To authenticate the user and connect to the mobile network",
            "To improve the performance of the device",
          ],
          correctAnswer:
            "To authenticate the user and connect to the mobile network",
        },
        {
          question_no: "6 / 20",
          question:
            "Which of the following is NOT a common mobile app distribution platform?",
          options: [
            "Google Play Store",
            "Apple App Store",
            "Windows Store",
            "Amazon Appstore",
          ],
          correctAnswer: "Amazon Appstore",
        },
        {
          question_no: "7 / 20",
          question:
            "What is the term used for the process of modifying a mobile device to remove restrictions imposed by the manufacturer or carrier?",
          options: [
            "Jailbreaking (for iOS) or Rooting (for Android)",
            "Unlocking",
            "Flashing",
            "Sideloading",
          ],
          correctAnswer: "Jailbreaking (for iOS) or Rooting (for Android)",
        },
        {
          question_no: "8 / 20",
          question:
            "Which mobile technology allows users to make payments using their smartphones?",
          options: [
            "Near Field Communication (NFC)",
            "Bluetooth",
            "Infrared",
            "Radio Frequency Identification (RFID)",
          ],
          correctAnswer: "Near Field Communication (NFC)",
        },
        {
          question_no: "9 / 20",
          question:
            "What is the term used for the process of transferring data from a mobile device to a computer or vice versa?",
          options: ["Streaming", "Syncing", "Pairing", "Tethering"],
          correctAnswer: "Syncing",
        },
        {
          question_no: "10 / 20",
          question:
            "Which mobile technology allows users to determine their exact location on Earth using satellite signals?",
          options: ["NFC", "Bluetooth", "GPS", "Wi-Fi"],
          correctAnswer: "GPS",
        },
        {
          question_no: "11 / 20",
          question:
            "What is the term used for the small graphical symbols used to represent emotions, objects, or ideas in text messages and social media posts?",
          options: ["Emoticons", "Stickers", "GIFs", "Memes"],
          correctAnswer: "Emoticons",
        },
        {
          question_no: "12 / 20",
          question:
            "Which of the following is NOT a common mobile app development platform?",
          options: ["Android Studio", "Xcode", "Eclipse", "Visual Studio"],
          correctAnswer: "Eclipse",
        },
        {
          question_no: "13 / 20",
          question:
            "What is the term used for the practice of designing mobile apps to provide a seamless user experience across different devices and screen sizes?",
          options: [
            "Responsive Design",
            "Adaptive Design",
            "Native Design",
            "Cross-Platform Design",
          ],
          correctAnswer: "Responsive Design",
        },
        {
          question_no: "14 / 20",
          question:
            "Which mobile technology allows users to exchange data between devices by touching them together?",
          options: ["Bluetooth", "Infrared", "NFC", "Wi-Fi Direct"],
          correctAnswer: "NFC",
        },
        {
          question_no: "15 / 20",
          question:
            "What is the term used for the process of sending multimedia messages such as photos, videos, and audio recordings via mobile devices?",
          options: [
            "Texting",
            "Emailing",
            "Instant Messaging",
            "MMS (Multimedia Messaging Service)",
          ],
          correctAnswer: "MMS (Multimedia Messaging Service)",
        },
        {
          question_no: "16 / 20",
          question:
            "Which mobile technology allows users to remotely access and control their computers or other devices from their smartphones?",
          options: [
            "Remote Desktop",
            "Virtual Private Network (VPN)",
            "Screen Mirroring",
            "Cloud Computing",
          ],
          correctAnswer: "Remote Desktop",
        },
        {
          question_no: "17 / 20",
          question:
            "What is the primary purpose of mobile device management (MDM) software?",
          options: [
            "To optimize battery life",
            "To enhance device security and manageability",
            "To improve network performance",
            "To customize the user interface",
          ],
          correctAnswer: "To enhance device security and manageability",
        },
        {
          question_no: "18 / 20",
          question:
            "Which of the following is NOT a common mobile app monetization strategy?",
          options: [
            "In-App Purchases",
            "Subscription Services",
            "Pay-Per-Click Advertising",
            "Freemium Model",
          ],
          correctAnswer: "Pay-Per-Click Advertising",
        },
        {
          question_no: "19 / 20",
          question:
            "What is the term used for the practice of designing mobile apps specifically for a single platform (e.g., iOS or Android)?",
          options: [
            "Native App Development",
            "Hybrid App Development",
            "Cross-Platform App Development",
            "Web App Development",
          ],
          correctAnswer: "Native App Development",
        },
        {
          question_no: "20 / 20",
          question:
            "Which mobile technology allows users to make voice calls over the internet instead of traditional cellular networks?",
          options: [
            "VoLTE (Voice over LTE)",
            "VoIP (Voice over Internet Protocol)",
            "5G",
            "LTE Advanced",
          ],
          correctAnswer: "VoIP (Voice over Internet Protocol)",
        },
      ];

      // Variables to track quiz state
      let currentQuestionIndex = 0;
      let score = 0;
      let timeLeft = 140;
      let timerInterval;

      // Function to start the quiz
      function startQuiz() {
        // Hide the start button and display the first question
        document.getElementById("start-button").style.display = "none";
        displayQuestion();
        startTimer();
      }

      // Function to display a question and its options
      function displayQuestion() {
        const currentQuestion = quizQuestions[currentQuestionIndex];
        const questionNo = document.getElementById("question-No");
        const questionText = document.getElementById("question-text");
        const answerButtons = document.getElementById("answer-buttons");

        // Clear previous question and answer options
        questionNo.innerHTML = "";
        questionText.innerHTML = "";
        answerButtons.innerHTML = "";

        // Display the current question
        questionNo.innerHTML = currentQuestion.question_no;
        questionText.innerHTML = currentQuestion.question;

        // Create answer buttons for each option
        currentQuestion.options.forEach((option) => {
          const button = document.createElement("button");
          button.innerText = option;
          button.classList.add("answer-button");
          button.style.backgroundColor = "#FF5F6D";
          answerButtons.appendChild(button);

          // Add click event listener to check the answer
          button.addEventListener("click", function () {
            checkAnswer(option);
          });
        });
      }

      // Function to check the selected answer
      function checkAnswer(selectedOption) {
        const currentQuestion = quizQuestions[currentQuestionIndex];

        // Check if the selected answer is correct
        if (selectedOption === currentQuestion.correctAnswer) {
          score++;
        }

        // Move to the next question or end the quiz if all questions are answered
        currentQuestionIndex++;

        if (currentQuestionIndex < quizQuestions.length) {
          displayQuestion();
        } else {
          endQuiz();
        }
      }

      // Function to start the timer
      function startTimer() {
        timerInterval = setInterval(function () {
          timeLeft--;

          // Update the timer text
          document.getElementById("timer").textContent = timeLeft;

          // End the quiz if time runs out
          if (timeLeft <= 0) {
            endQuiz();
          }
        }, 1000);
      }

      // Function to end the quiz
      function endQuiz() {
        // Stop the timer
        clearInterval(timerInterval);

        // Calculate the score percentage
        const scorePercentage = (score / quizQuestions.length) * 100;

        // Display the final score
        const questionContainer = document.getElementById("question-container");
        questionContainer.innerHTML = `
<h2>Quiz Completed!</h2>
<p>Your Score: ${score} out of ${quizQuestions.length}</p>
<p>Score Percentage: ${scorePercentage}%</p>
<center class="result-button">
    <a href="/">
        <button id="home-button" style="background-color:#FF5F6D">Play Other quiz</button>
    </a>
    <a href="">
        <button id="home-button" style="background-color:#FF5F6D">Play Again</button>
    </a>
</center>
`;
      }

      // Add event listener to start the quiz when the start button is clicked
      document
        .getElementById("start-button")
        .addEventListener("click", startQuiz);
    </script>
