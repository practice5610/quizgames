    <script>
      function hideImage() {
        console.log("hide");
        document.getElementById("flage").style.display = "none";
      }
      const quizQuestions = [
        {
          question_no: "1 / 20",
          question:
            "What is the term for the process of managing money and investments?",
          options: ["Economics", "Accounting", "Finance", "Management"],
          correctAnswer: "Finance",
        },
        {
          question_no: "2 / 20",
          question:
            "What is the term for the amount of money borrowed or invested, not including any interest or dividends?",
          options: ["Principal", "Interest", "Dividend", "Yield"],
          correctAnswer: "Principal",
        },
        {
          question_no: "3 / 20",
          question:
            "What is the term for the rate at which money grows over time, typically expressed as a percentage?",
          options: ["Principal", "Interest", "Dividend", "Yield"],
          correctAnswer: "Yield",
        },
        {
          question_no: "4 / 20",
          question:
            "Which of the following is not a type of financial institution?",
          options: ["Bank", "Hedge fund", "Corporation", "Credit union"],
          correctAnswer: "Corporation",
        },
        {
          question_no: "5 / 20",
          question:
            "What is the term for a financial instrument that represents ownership in a company?",
          options: ["Bond", "Stock", "Mutual fund", "Certificate of deposit"],
          correctAnswer: "Stock",
        },
        {
          question_no: "6 / 20",
          question:
            "What is the term for the process of spreading investments across different assets to reduce risk?",
          options: [
            "Diversification",
            "Consolidation",
            "Specialization",
            "Concentration",
          ],
          correctAnswer: "Diversification",
        },
        {
          question_no: "7 / 20",
          question:
            "What is the term for a loan that is secured by collateral?",
          options: [
            "Secured loan",
            "Unsecured loan",
            "Mortgage",
            "Line of credit",
          ],
          correctAnswer: "Secured loan",
        },
        {
          question_no: "8 / 20",
          question:
            "What is the term for a financial instrument that represents a loan made by an investor to a borrower?",
          options: ["Stock", "Bond", "Mutual fund", "Certificate of deposit"],
          correctAnswer: "Bond",
        },
        {
          question_no: "9 / 20",
          question:
            "Which of the following is not a measure of investment risk?",
          options: [
            "Return on investment",
            "Beta",
            "Standard deviation",
            "Price-earnings ratio",
          ],
          correctAnswer: "Return on investment",
        },
        {
          question_no: "10 / 20",
          question:
            "What is the term for the process of evaluating the financial health and performance of a company?",
          options: [
            "Financial analysis",
            "Financial planning",
            "Financial management",
            "Financial reporting",
          ],
          correctAnswer: "Financial analysis",
        },
        {
          question_no: "11 / 20",
          question:
            "What is the term for the interest rate at which banks lend money to each other overnight?",
          options: [
            "Federal funds rate",
            "Prime rate",
            "LIBOR (London Interbank Offered Rate)",
            "Discount rate",
          ],
          correctAnswer: "Federal funds rate",
        },
        {
          question_no: "12 / 20",
          question:
            "What is the term for the total amount of money that a company receives from selling goods or services?",
          options: ["Revenue", "Profit", "Interest", "Dividend"],
          correctAnswer: "Revenue",
        },
        {
          question_no: "13 / 20",
          question:
            "What is the term for the process of estimating the value of an asset or investment?",
          options: [
            "Depreciation",
            "Appreciation",
            "Valuation",
            "Amortization",
          ],
          correctAnswer: "Valuation",
        },
        {
          question_no: "14 / 20",
          question:
            "What is the term for the risk that an investment will lose value due to changes in interest rates?",
          options: [
            "Market risk",
            "Interest rate risk",
            "Credit risk",
            "Inflation risk",
          ],
          correctAnswer: "Interest rate risk",
        },
        {
          question_no: "15 / 20",
          question:
            "Which of the following is not a factor that affects the price of a bond?",
          options: [
            "Interest rates",
            "Credit rating",
            "Market demand",
            "Dividend yield",
          ],
          correctAnswer: "Dividend yield",
        },
        {
          question_no: "16 / 20",
          question:
            "What is the term for the total amount of money that a company has left after paying all of its expenses?",
          options: ["Revenue", "Profit", "Interest", "Dividend"],
          correctAnswer: "Profit",
        },
        {
          question_no: "17 / 20",
          question:
            "What is the term for the risk that an investment will lose value due to changes in the overall economy?",
          options: [
            "Market risk",
            "Interest rate risk",
            "Credit risk",
            "Inflation risk",
          ],
          correctAnswer: "Market risk",
        },
        {
          question_no: "18 / 20",
          question:
            "What is the term for the process of converting an asset into cash?",
          options: ["Solvency", "Leverage", "Amortization", "Liquidity"],
          correctAnswer: "Liquidity",
        },
        {
          question_no: "19 / 20",
          question:
            "What is the term for the risk that an investment will lose value due to changes in the issuer's creditworthiness?",
          options: [
            "Market risk",
            "Interest rate risk",
            "Credit risk",
            "Inflation risk",
          ],
          correctAnswer: "Credit risk",
        },
        {
          question_no: "20 / 20",
          question:
            "What is the term for the measure of how much an investment's return fluctuates over time?",
          options: [
            "Return on investment",
            "Beta",
            "Standard deviation",
            "Price-earnings ratio",
          ],
          correctAnswer: "Standard deviation",
        },
      ];

      // Variables to track quiz state
      let currentQuestionIndex = 0;
      let score = 0;
      let timeLeft = 140;
      let timerInterval;

      // Function to start the quiz
      function startQuiz() {
        // Hide the start button and display the first question
        document.getElementById("start-button").style.display = "none";
        displayQuestion();
        startTimer();
      }

      // Function to display a question and its options
      function displayQuestion() {
        const currentQuestion = quizQuestions[currentQuestionIndex];
        const questionNo = document.getElementById("question-No");
        const questionText = document.getElementById("question-text");
        const answerButtons = document.getElementById("answer-buttons");

        // Clear previous question and answer options
        questionNo.innerHTML = "";
        questionText.innerHTML = "";
        answerButtons.innerHTML = "";

        // Display the current question
        questionNo.innerHTML = currentQuestion.question_no;
        questionText.innerHTML = currentQuestion.question;

        // Create answer buttons for each option
        currentQuestion.options.forEach((option) => {
          const button = document.createElement("button");
          button.innerText = option;
          button.classList.add("answer-button");
          button.style.backgroundColor = "#FF5F6D";
          answerButtons.appendChild(button);

          // Add click event listener to check the answer
          button.addEventListener("click", function () {
            checkAnswer(option);
          });
        });
      }

      // Function to check the selected answer
      function checkAnswer(selectedOption) {
        const currentQuestion = quizQuestions[currentQuestionIndex];

        // Check if the selected answer is correct
        if (selectedOption === currentQuestion.correctAnswer) {
          score++;
        }

        // Move to the next question or end the quiz if all questions are answered
        currentQuestionIndex++;

        if (currentQuestionIndex < quizQuestions.length) {
          displayQuestion();
        } else {
          endQuiz();
        }
      }

      // Function to start the timer
      function startTimer() {
        timerInterval = setInterval(function () {
          timeLeft--;

          // Update the timer text
          document.getElementById("timer").textContent = timeLeft;

          // End the quiz if time runs out
          if (timeLeft <= 0) {
            endQuiz();
          }
        }, 1000);
      }

      // Function to end the quiz
      function endQuiz() {
        // Stop the timer
        clearInterval(timerInterval);

        // Calculate the score percentage
        const scorePercentage = (score / quizQuestions.length) * 100;

        // Display the final score
        const questionContainer = document.getElementById("question-container");
        questionContainer.innerHTML = `
<h2>Quiz Completed!</h2>
<p>Your Score: ${score} out of ${quizQuestions.length}</p>
<p>Score Percentage: ${scorePercentage}%</p>
<center class="result-button">
<a href="/">
<button id="home-button" style="background-color:#FF5F6D ">Play Other quiz</button>
</a>
<a href="">
<button id="home-button" style="background-color:#FF5F6D ">Play Again</button>
</a>
</center>
`;
      }

      // Add event listener to start the quiz when the start button is clicked
      document
        .getElementById("start-button")
        .addEventListener("click", startQuiz);
    </script>
