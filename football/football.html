    <script>
      function hideImage() {
        console.log("hide");

      const quizQuestions = [
        {
          question_no: "1 / 20",

          options: [

        {

          ],

        },
        {

          question:
            "What is the name of the trophy awarded to the winner of the UEFA Champions League?",
          options: [
            "FIFA World Cup Trophy",
            "UEFA Europa League Trophy",
            "UEFA Champions League Trophy",
            "Premier League Trophy",
          ],
          correctAnswer: "UEFA Champions League Trophy",
        },
        {
          question_no: "6 / 20",
          question: 'In football, what does the term "offside" refer to?',
          options: [
            "When a player commits a foul",
            "When a player scores a goal with their hand",
            "When a player is in the opponent's half of the field ahead of the ball and the second-to-last defender",
            "When a player receives a yellow card",
          ],
          correctAnswer:
            "When a player is in the opponent's half of the field ahead of the ball and the second-to-last defender",
        },
        {
          question_no: "7 / 20",
          question: "Who won the Ballon d'Or award in 2020?",
          options: [
            "Lionel Messi",

            "Robert Lewandowski",

        },

            "Home Nations Championship",
          ],
          correctAnswer: "Home Nations Championship",
        },
        {
          question_no: "10 / 20",
          question:
            "Who is the current manager of the Liverpool Football Club?",
          options: [
            "Jurgen Klopp",
            "Pep Guardiola",
            "Zinedine Zidane",
            "Jose Mourinho",
          ],
          correctAnswer: "Jurgen Klopp",
        },
        {
          question_no: "11 / 20",
          question: "Which country won the FIFA Women's World Cup in 2019?",
          options: ["United States", "Germany", "Brazil", "England"],
          correctAnswer: "United States",
        },
        {
          question_no: "12 / 20",
          question:
            "What is the duration of a standard football match, excluding extra time?",
          options: ["60 minutes", "90 minutes", "120 minutes", "45 minutes"],
          correctAnswer: "90 minutes",
        },
        {
          question_no: "13 / 20",
          question:

          options: [

          ],
          correctAnswer: "Alan Shearer",
        },
        {
          question_no: "14 / 20",
          question:
            "What is the nickname of the Brazil national football team?",
          options: ["The Blues", "The Reds", "The Samba Boys", "The Azzurri"],
          correctAnswer: "The Samba Boys",
        },
        {
          question_no: "15 / 20",
          question:
            "What is the name of the football tournament contested between European national teams?",
          options: [
            "Copa America",
            "Euro Cup",
            "Africa Cup of Nations",
            "Asian Cup",
          ],
          correctAnswer: "Euro Cup",
        },
        {
          question_no: "16 / 20",
          question: "Which player has won the most FIFA Ballon d'Or awards?",
          options: [
            "Lionel Messi",
            "Cristiano Ronaldo",
            "Michel Platini",
            "Diego Maradona",
          ],
          correctAnswer: "Lionel Messi",
        },
        {
          question_no: "17 / 20",
          question:
            "What is the name of the football tournament contested between club teams from South America?",
          options: [
            "Copa America",
            "Euro Cup",
            "Copa Libertadores",
            "CONCACAF Champions League",
          ],
          correctAnswer: "Copa Libertadores",
        },
        {
          question_no: "18 / 20",
          question:
            'Which footballer is often referred to as "The King of Football"?',
          options: [
            "Diego Maradona",
            "Lionel Messi",
            "Pele",
            "Cristiano Ronaldo",
          ],
          correctAnswer: "Pele",
        },
        {
          question_no: "19 / 20",
          question:
            "What is the term for a goal scored directly from a corner kick?",
          options: ["Own goal", "Penalty goal", "Header", "Olimpico"],
          correctAnswer: "Olimpico",
        },
        {
          question_no: "20 / 20",
          question:
            "What is the name of the stadium where the FIFA World Cup Final was held in 2014?",
          options: [
            "Maracana Stadium",
            "Wembley Stadium",
            "Santiago Bernabeu Stadium",
            "Estadio do Dragao",
          ],
          correctAnswer: "Maracana Stadium",
        },
      ];

      // Variables to track quiz state
      let currentQuestionIndex = 0;
      let score = 0;
      let timeLeft = 140;
      let timerInterval;

      // Function to start the quiz
      function startQuiz() {
        // Hide the start button and display the first question
        document.getElementById("start-button").style.display = "none";
        displayQuestion();
        startTimer();
      }

      // Function to display a question and its options
      function displayQuestion() {
        const currentQuestion = quizQuestions[currentQuestionIndex];
        const questionNo = document.getElementById("question-No");
        const questionText = document.getElementById("question-text");
        const answerButtons = document.getElementById("answer-buttons");

        // Clear previous question and answer options
        questionNo.innerHTML = "";
        questionText.innerHTML = "";
        answerButtons.innerHTML = "";

        // Display the current question
        questionNo.innerHTML = currentQuestion.question_no;
        questionText.innerHTML = currentQuestion.question;

        // Create answer buttons for each option
        currentQuestion.options.forEach((option) => {
          const button = document.createElement("button");
          button.innerText = option;
          button.classList.add("answer-button");
          button.style.backgroundColor = "#FF5F6D";
          answerButtons.appendChild(button);

          // Add click event listener to check the answer
          button.addEventListener("click", function () {
            checkAnswer(option);
          });
        });
      }

      // Function to check the selected answer
      function checkAnswer(selectedOption) {
        const currentQuestion = quizQuestions[currentQuestionIndex];

        // Check if the selected answer is correct
        if (selectedOption === currentQuestion.correctAnswer) {
          score++;
        }

        // Move to the next question or end the quiz if all questions are answered
        currentQuestionIndex++;

        if (currentQuestionIndex < quizQuestions.length) {
          displayQuestion();
        } else {
          endQuiz();
        }
      }

      // Function to start the timer
      function startTimer() {
        timerInterval = setInterval(function () {
          timeLeft--;

          // Update the timer text
          document.getElementById("timer").textContent = timeLeft;

          // End the quiz if time runs out
          if (timeLeft <= 0) {
            endQuiz();
          }
        }, 1000);
      }

      // Function to end the quiz
      function endQuiz() {
        // Stop the timer
        clearInterval(timerInterval);

        // Calculate the score percentage
        const scorePercentage = (score / quizQuestions.length) * 100;

        // Display the final score
        const questionContainer = document.getElementById("question-container");
        questionContainer.innerHTML = `
<h2>Quiz Completed!</h2>
<p>Your Score: ${score} out of ${quizQuestions.length}</p>
<p>Score Percentage: ${scorePercentage}%</p>
<center class="result-button">
    <a href="/">
        <button id="home-button" style="background-color:#FF5F6D">Play Other quiz</button>
    </a>
    <a href="">
        <button id="home-button" style="background-color:#FF5F6D">Play Again</button>
    </a>
</center>
`;
      }

      // Add event listener to start the quiz when the start button is clicked
      document
        .getElementById("start-button")
        .addEventListener("click", startQuiz);
    </script>
